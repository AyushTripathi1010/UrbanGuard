[project]
name = "urbanguard-shared"
version = "0.1.0"
description = "Shared Pydantic models, Kafka topics, settings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiokafka>=0.12",
    "cramjam>=2.8",
    "structlog>=24.4",
    "langfuse>=2.50",
    "prometheus-fastapi-instrumentator>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
