[project]
name = "urbanguard"
version = "0.1.0"
description = "Real-time city safety intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ayush Tripathi" }]

[tool.uv.workspace]
members = [
    "shared",
    "services/ingest",
    "services/detect",
    "services/agents",
    "services/rl",
    "services/replay",
    "services/gateway",
]

[tool.uv.sources]
urbanguard-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "learning"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/*/tests", "shared/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["services", "shared"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__", "data", "learning"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "warning"
