[project]
name = "urbanguard"
version = "0.1.0"
description = "Real-time city safety intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ayush Tripathi" }]

[tool.uv.workspace]
members = [
    "shared",
    "services/ingest",
    "services/detect",
    "services/agents",
    "services/rl",
    "services/replay",
    "services/gateway",
]

[tool.uv.sources]
urbanguard-shared = { workspace = true }
urbanguard-agents = { workspace = true }
urbanguard-ingest = { workspace = true }
urbanguard-detect = { workspace = true }
urbanguard-rl = { workspace = true }
urbanguard-replay = { workspace = true }
urbanguard-gateway = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "learning"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: line length (we use format, not lint, for line wrapping)
# UP042: str + Enum is fine pre-StrEnum migration; we'll move when 3.11 is min
# UP046/UP047: PEP 695 type-param syntax — fine but not required for our generics
# SIM105: try/except/pass reads as clearly as contextlib.suppress; either is fine
ignore = ["E501", "UP042", "UP046", "UP047", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/ingest/tests", "services/detect/tests", "services/agents/tests", "services/rl/tests", "services/replay/tests", "services/gateway/tests", "shared/tests"]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["services", "shared"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__", "data", "learning"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "warning"
