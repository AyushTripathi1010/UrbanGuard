[project]
name = "urbanguard-gateway"
version = "0.1.0"
description = "Public FastAPI for the dashboard, SSE alert stream"
requires-python = ">=3.12,<3.13"
dependencies = [
    "urbanguard-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiokafka>=0.12",
    "sse-starlette>=2.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "redis[hiredis]>=5.2",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
