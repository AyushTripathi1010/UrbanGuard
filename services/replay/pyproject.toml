[project]
name = "urbanguard-replay"
version = "0.1.0"
description = "Nightly aggregation and Kafka offset replay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "urbanguard-shared",
    "aiokafka>=0.12",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "structlog>=24.4",
    "cramjam>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]
