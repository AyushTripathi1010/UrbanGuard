[project]
name = "urbanguard-agents"
version = "0.1.0"
description = "LangGraph triage / route / notify / memory pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "urbanguard-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiokafka>=0.12",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "google-generativeai>=0.8",
    "groq>=0.13",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "langfuse>=2.50",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
