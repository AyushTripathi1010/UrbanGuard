[project]
name = "urbanguard-ingest"
version = "0.1.0"
description = "Frame ingest producers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "urbanguard-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiokafka>=0.12",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "numpy>=2.0",
    "httpx>=0.27",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
