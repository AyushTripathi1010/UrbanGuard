[project]
name = "urbanguard-detect"
version = "0.1.0"
description = "CLIP zero-shot + ResNet severity scoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "urbanguard-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiokafka>=0.12",
    "torch>=2.5",
    "torchvision>=0.20",
    "open-clip-torch>=2.29",
    "pillow>=11.0",
    "numpy>=2.0",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detect"]
