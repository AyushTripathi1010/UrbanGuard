[project]
name = "urbanguard-rl"
version = "0.1.0"
description = "PPO zone-priority policy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "urbanguard-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiokafka>=0.12",
    "stable-baselines3>=2.4",
    "gymnasium>=1.0",
    "torch>=2.5",
    "numpy>=2.0",
    "mlflow>=2.18",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl"]
